<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GDD EDD 完整流程</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="admin-shell">
    <header class="admin-header"><div><p class="eyebrow">GDD EDD</p><h1>完整评价流程</h1></div><button id="refresh" type="button" class="secondary">刷新</button></header>
    <div id="admin-message" class="message" role="status">正在连接...</div>
    <form id="session-form" class="admin-form" hidden>
      <div class="form-row">
        <label>执行标识<input name="evaluationId" required maxlength="80" placeholder="stray-cat-r1"></label>
        <label>游戏名称<input name="gameTitle" required maxlength="80" value="流浪猫收养记"></label>
      </div>
      <label>GDD 引用<input name="gddReference" required maxlength="300" placeholder="Keco 文档 ID、修订号或文件路径"></label>
      <label>运行证据<textarea name="runtimeEvidence" maxlength="1000" rows="2" placeholder="可选：构建版本、试玩记录或截图引用"></textarea></label>
      <div class="form-row">
        <label>AI 核心玩法（0–50）<input name="aiCoreScore" type="number" min="0" max="50" step="0.1" required value="50"></label>
        <label>AI 玩家体验（0–50）<input name="aiExperienceScore" type="number" min="0" max="50" step="0.1" required value="50"></label>
      </div>
      <label>有效期（天）<input name="expiryDays" type="number" min="1" max="30" required value="7"></label>
      <fieldset class="issue-editor"><legend>AI 全部问题与扣分</legend><div id="issue-list"></div><button id="add-issue" type="button" class="secondary">+ 添加问题</button></fieldset>
      <button type="submit">生成三份文档和玩家链接</button>
    </form>
    <template id="issue-template"><div class="issue-row">
      <select data-field="dimension" aria-label="问题维度"><option value="core">核心玩法</option><option value="experience">玩家体验</option></select>
      <input data-field="deduction" type="number" min="0.1" max="50" step="0.1" required placeholder="扣分">
      <input data-field="evidence" required maxlength="300" placeholder="证据位置">
      <input data-field="description" required maxlength="500" placeholder="问题与影响">
      <input data-field="suggestion" required maxlength="500" placeholder="最小修改建议">
      <button type="button" class="secondary remove-issue" aria-label="删除问题">×</button>
    </div></template>
    <section class="sessions" aria-labelledby="sessions-title"><h2 id="sessions-title">已生成链接</h2><div id="session-list" class="session-list"></div></section>
  </main>
  <script src="/admin.js" type="module"></script>
</body>
</html>
